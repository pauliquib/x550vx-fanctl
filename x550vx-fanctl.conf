# /etc/x550vx-fanctl.conf — x550vx-fanctl daemon configuration
# Sourced by bash — keep values valid bash syntax.

# Polling interval in seconds (how often the temperature is re-evaluated)
POLL_INTERVAL=2

# Fans to manage. 1 = fan1 (the only fan on X550VX), 2 = GPU fan (dual-fan
# ASUS models only). "1 2" controls both.
FANS="1"

# Temperature (°C) at which the emergency path triggers: daemon restores
# automatic EC control and exits. Hardware safety net — keep >= 85.
CRIT_TEMP=90

# Minimum change of raw speed units that triggers a new EC write (filters
# out single-degree jitter around curve points)
MIN_SPEED_DELTA=10

# Re-assert the current manual speed every N seconds (0 = disabled).
# Protects against firmware paths that sneak fan control back to auto
# (thermal events, suspend/resume).
KEEPALIVE_INTERVAL=30

# On daemon stop/signal, return the fan to automatic EC control
RESTORE_AUTO_ON_EXIT=yes

# Fan curve — piecewise linear between points.
# CURVE_TEMPS:  °C, strictly ascending
# CURVE_SPEEDS: raw EC speed units 0-255 (verified: 0 = fan fully stopped)
# Outside the range, the nearest endpoint is used. Default curve keeps the
# fan off up to 45 °C and reaches full speed at 80 °C.
CURVE_TEMPS=(45 60 70 80)
CURVE_SPEEDS=(0 80 160 255)

# Daemon log output (journald collects it when run under systemd)
QUIET=no
